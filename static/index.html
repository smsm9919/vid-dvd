<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoFactory Local</title><style>body{font-family:Arial,sans-serif;background:#0d1117;color:#e6edf3;margin:0}.wrap{max-width:1050px;margin:30px auto;padding:20px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:20px;margin-bottom:18px}input,textarea,select{width:100%;box-sizing:border-box;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:9px;padding:12px;margin:6px 0 14px}textarea{min-height:150px}button{background:#238636;color:#fff;border:0;padding:12px 18px;border-radius:9px;cursor:pointer;font-weight:700}.status{font-family:monospace;white-space:pre-wrap;background:#010409;padding:12px;border-radius:9px}.scene{border-top:1px solid #30363d;padding:12px 0}.muted{color:#8b949e}a{color:#58a6ff}</style></head><body><div class="wrap"><div class="card"><h1>🎬 VideoFactory Local</h1><p class="muted">Generate cinematic shorts locally. No automatic publishing.</p><div id="health" class="status">Checking...</div></div><div class="card"><h2>1. Topic / Script</h2><label>Topic</label><input id="topic" value="A cinematic battle between a venomous snake and a lion in a dark jungle"><label>Script (optional)</label><textarea id="script">Deep in a dark jungle, a powerful lion encounters a massive venomous snake. The predators freeze. The snake strikes first. The lion dodges, roars and charges back. At the climax, the snake sprays venom toward the lion. The lion retreats for a moment, then turns for one final confrontation.</textarea><label>Language</label><select id="language"><option value="en">English</option><option value="de">German</option><option value="ar">Arabic</option></select><label>Duration</label><input id="duration" type="number" min="5" max="120" value="30"><label>Scenes</label><input id="scenes" type="number" min="1" max="12" value="5"><button onclick="plan()">Plan scenes</button></div><div class="card"><h2>2. Review</h2><div id="plan" class="muted">No project yet.</div><button id="gen" style="display:none;margin-top:12px" onclick="generate()">Generate video</button></div><div class="card"><h2>3. Output</h2><div id="out" class="status">No output yet.</div></div></div><script>let pid=null;async function health(){const r=await fetch('/api/health');const x=await r.json();document.getElementById('health').textContent=JSON.stringify(x,null,2)}async function plan(){const body={title:'Cinematic Short',topic:topic.value,script:script.value,language:language.value,duration:+duration.value,scene_count:+scenes.value};const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();pid=x.id;document.getElementById('plan').innerHTML=x.scenes.map(s=>`<div class="scene"><b>Scene ${s.index} · ${s.duration}s</b><br>${s.description}<br><span class="muted">${s.prompt}</span></div>`).join('');document.getElementById('gen').style.display='inline-block';document.getElementById('out').textContent=`Project ${pid} planned (${x.planner}).`}async function generate(){document.getElementById('out').textContent='Generating. Keep ComfyUI running and do not close this app.';const r=await fetch(`/api/projects/${pid}/generate`,{method:'POST'});const x=await r.json();if(!r.ok){document.getElementById('out').textContent=JSON.stringify(x,null,2);return}document.getElementById('out').innerHTML=`Done — <a href="${x.download}">Download final MP4</a>`}health();</script></body></html>
